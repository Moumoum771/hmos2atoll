name: Build

# Manual trigger for now — this workflow is a scaffold until the A705FN (a70q)
# kernel source is in place. Switch to push/pull_request triggers once the
# build steps below are filled in and actually produce something.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Check free space
        run: df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs unzip curl python3-pip
          pip install brotli

      - name: Fetch EROFS tools
        run: tools/fetch_tools.sh

      # --- Build steps below are placeholders -------------------------------
      # build/build_all.sh needs SWEET_KERNEL (build/env.sh) pointing at a
      # real a70q (A705FN / SM7150) kernel checkout with the OpenHarmony
      # patches from src/kernel/patches applied. Until that exists, this
      # workflow stops after setup so it stays green and useful as a sanity
      # check (checkout, disk space, deps) without pretending to build
      # something that doesn't exist yet.
      #
      # Once the kernel source is ready:
      #   1. Either commit it as part of this repo's build/work (not
      #      recommended, kernels are huge) or clone it as a separate step
      #      here, e.g.:
      #        git clone --depth 1 <a70q kernel repo url> build/work/android_kernel_a70q
      #   2. Point SWEET_KERNEL (rename it if you like) at that path.
      #   3. Uncomment the real build step below.
      #
      # - name: Build kernel + binaries
      #   run: |
      #     source build/env.sh
      #     build/build_all.sh "$WORK"
      #
      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: hmos2atoll-build
      #     path: |
      #       prebuilt/kernel/Image.gz
      #       out/*.img
      #     if-no-files-found: ignore

      - name: Scaffold complete
        run: echo "Checkout, disk cleanup and dependency setup all succeeded. Real build steps are not wired up yet — see comments in this file."
